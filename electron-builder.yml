appId: com.kutneruri.yinamp
productName: Yinamp
icon: build/icon.png
afterAllArtifactBuild: scripts/report-desktop.cjs
directories:
  output: release
files:
  - package.json
  - build-info.json
  - index.html
  - LICENSE
  - '*.mjs'
  - electron/**
  - '!electron/launch.mjs'
  - '!electron/dev-branding.mjs'
  - src/**
  - skins/**
asar: true
npmRebuild: false
artifactName: Yinamp-latest-${os}-${arch}.${ext}
mac:
  icon: build/icon.icns
  target: dmg
  category: public.app-category.music
  identity: null
dmg:
  icon: build/icon.icns
  background: build/dmg/background.jpg
  # Window size and icon centers must match scripts/render-dmg-guide.swift.
  window:
    width: 800
    height: 670
  iconSize: 88
  contents:
    - x: 210
      y: 114
    - x: 590
      y: 114
      type: link
      path: /Applications
win:
  target: portable
linux:
  target: AppImage
  category: AudioVideo
  # electron-builder names x64 AppImages "x86_64"; keep the project-wide "x64" name.
  artifactName: Yinamp-latest-${os}-x64.${ext}
