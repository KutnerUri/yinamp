name: Tests

# Runs on every push to every branch. On main, a successful run starts
# "Publish desktop" and "Deploy demo" (see their workflow_run triggers).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an older test run. On main the newer
# run's publish compares against the last published commit, so nothing is lost.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Electron app tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check script syntax
        run: for file in scripts/*.{js,mjs,cjs}; do [ ! -f "$file" ] || node --check "$file" || exit 1; done
      - uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  bootstrap:
    name: Bootstrap tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: Native launcher tests
        run: go test ./...
        working-directory: launcher
