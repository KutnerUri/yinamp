name: Windows build check

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/package-desktop.yml'
      - 'scripts/build-*.mjs'
      - 'scripts/prepare-build.mjs'
      - 'scripts/electron-runtime.mjs'
      - 'electron-builder.yml'
      - 'launcher/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/package-desktop.yml
    with:
      runner: windows-2025
      platform: win
      arch: x64
      runtime: win32-x64
      executable: release/win-unpacked/Yinamp.exe
      archive: release/win-unpacked/resources/app.asar
      artifact-name: windows-installer
      full-tests: false
