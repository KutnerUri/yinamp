name: Latest desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let publishing finish; a newer push queues behind the current build.
concurrency:
  group: latest-desktop-build
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            executable: release/mac-arm64/Yinamp.app/Contents/MacOS/Yinamp
            archive: release/mac-arm64/Yinamp.app/Contents/Resources/app.asar
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/Yinamp.app/Contents/MacOS/Yinamp
            archive: release/mac/Yinamp.app/Contents/Resources/app.asar
          - os: windows-2025
            platform: win
            arch: x64
            executable: release/win-unpacked/Yinamp.exe
            archive: release/win-unpacked/resources/app.asar
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            executable: release/linux-unpacked/yinamp
            archive: release/linux-unpacked/resources/app.asar
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Package desktop app
        run: npm run build:desktop -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check bundled app and dependencies
        run: '"$APP_EXECUTABLE" scripts/smoke-desktop.mjs "$APP_ARCHIVE"'
        env:
          ELECTRON_RUN_AS_NODE: '1'
          APP_EXECUTABLE: ${{ matrix.executable }}
          APP_ARCHIVE: ${{ matrix.archive }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: downloads
          merge-multiple: true
      - name: Publish rolling latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current_sha" != "$BUILD_SHA" ]; then
            echo 'Main has moved ahead; a newer workflow run will publish its build.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd downloads
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum Yinamp-* > SHA256SUMS.txt
          jq -n --arg commit "$BUILD_SHA" --arg run "$BUILD_RUN" \
            '{commit: $commit, workflow: $run}' > BUILD-INFO.json
          cat > ../release-notes.md <<EOF
          Automatically built from main. Experimental, unsigned desktop downloads with the runtime included; no Node.js installation required.

          Commit: $BUILD_SHA
          Build: $BUILD_RUN

          macOS: choose arm64 for Apple Silicon or x64 for Intel, open the DMG and drag Yinamp to Applications. These builds are not notarized; macOS may block opening them until you allow the app in Privacy & Security.
          Windows: download the x64 EXE and run it. SmartScreen may show an unsigned-app warning.
          Linux: download the x64 AppImage, make it executable and run it. Requires a desktop Linux system with FUSE support (or use the AppImage's --appimage-extract-and-run option).

          Download again to update. SHA256SUMS.txt contains checksums; BUILD-INFO.json identifies the source commit. All platforms must build and pass bundled-app checks before publishing starts. A failed build leaves the previous downloads available.
          EOF
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build --target "$BUILD_SHA" \
              --title 'Latest build' --prerelease --latest=false \
              --notes-file ../release-notes.md ./*
          else
            gh release upload latest-build ./* --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest-build" \
              -f sha="$BUILD_SHA" -F force=true
            gh release edit latest-build --title 'Latest build' \
              --prerelease --latest=false --notes-file ../release-notes.md
          fi
