name: Latest desktop build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: Build and publish desktop packages after tests (branches publish previews)
        type: boolean
        default: true
      demo:
        description: Deploy demo after tests (default branch only)
        type: boolean
        default: true

permissions:
  contents: read

# Let main publishing finish. Branch/PR runs can supersede earlier checks.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.select.outputs.desktop }}
      demo: ${{ steps.select.outputs.demo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Select jobs for the tested commit
        id: select
        run: node scripts/ci-changes.mjs

  checks:
    uses: ./.github/workflows/tests.yml

  demo:
    needs: [checks, changes]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.changes.outputs.demo == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  desktop:
    needs: [checks, changes]
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.changes.outputs.desktop == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
