name: Latest desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let publishing finish; a newer push queues behind the current build.
concurrency:
  group: latest-desktop-build
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            runtime: darwin-arm64
            executable: release/mac-arm64/Yinamp.app/Contents/MacOS/Yinamp
            archive: release/mac-arm64/Yinamp.app/Contents/Resources/app.asar
          - os: macos-15-intel
            platform: mac
            arch: x64
            runtime: darwin-x64
            executable: release/mac/Yinamp.app/Contents/MacOS/Yinamp
            archive: release/mac/Yinamp.app/Contents/Resources/app.asar
          - os: windows-2025
            platform: win
            arch: x64
            runtime: win32-x64
            executable: release/win-unpacked/Yinamp.exe
            archive: release/win-unpacked/resources/app.asar
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runtime: linux-x64
            executable: release/linux-unpacked/yinamp
            archive: release/linux-unpacked/resources/app.asar
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.15.1'
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Package desktop app
        run: npm run build:desktop -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check bundled app and dependencies
        run: '"$APP_EXECUTABLE" scripts/smoke-desktop.mjs "$APP_ARCHIVE"'
        env:
          ELECTRON_RUN_AS_NODE: '1'
          APP_EXECUTABLE: ${{ matrix.executable }}
          APP_ARCHIVE: ${{ matrix.archive }}
      - name: Prepare versioned application update
        run: node scripts/create-update.mjs "$APP_ARCHIVE" "$APP_PLATFORM"
        env:
          APP_ARCHIVE: ${{ matrix.archive }}
          APP_PLATFORM: ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.asar
            release/*.update.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: downloads
          merge-multiple: true
      - name: Publish rolling latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-latest.mjs downloads
